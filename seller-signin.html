  <body>
    <header>
      <a class="logo logins" href="index.html">The Marketplace</a>
      <div class="nav-body mini-close">
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="buyer-signin.html">Buyer Login</a>
          <a href="admin-login.html">Admin</a>
        </nav>
      </div>

      <div class="nav_controls cons">
        <span class="material-symbols-outlined menu" onclick="toggleMenu()">
          menu
        </span>
        <!-- <span class="material-symbols-outlined close"> close </span> -->
      </div>
      <button
        class="theme-toggle button material-symbols-outlined"
        type="button"
      >
        dark_mode
      </button>
    </header>
    <main class="login-container">
      <div class="auth-card">
        <div class="auth-badge">📦 Seller Portal</div>
        <h1>Seller Login</h1>
        <p>Manage your listings, inventory, and sales.</p>

        <form id="seller-signin-form">
          <div class="form-group">
            <label for="seller-email">Email or Phone Number</label>
            <input
              type="text"
              id="seller-email"
              name="email"
              placeholder="seller@example.com or (123) 456-7890"
              required
            />
            <div class="error-message" id="email-error"></div>
          </div>

          <div class="form-group">
            <label for="seller-password">Password</label>
            <input
              type="password"
              id="seller-password"
              name="password"
              placeholder="••••••••"
              required
            />
            <div class="error-message" id="password-error"></div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="seller-remember" name="remember" />
            <label for="seller-remember">Remember me</label>
          </div>

          <button type="submit">Sign In as Seller</button>

          <a href="buyer-signin.html" class="back-button"
            >🛍️ Switch to Buyer Login</a
          >

          <div class="bottom-links">
            <p>
              Don't have a seller account?
              <a href="register.html">Create one</a>
            </p>
          </div>
        </form>
      </div>
    </main>

    <script>
      // Helper functions
      const isValidEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const isValidPhone = (phone) =>
        /^[\d\s\-\(\)\+]{10,}$/.test(phone.replace(/\s/g, "")) &&
        /\d/.test(phone);

      // Form submission
      document
        .getElementById("seller-signin-form")
        .addEventListener("submit", (e) => {
          e.preventDefault();

          document.getElementById("email-error").classList.remove("show");
          document.getElementById("password-error").classList.remove("show");

          const email = document.getElementById("seller-email").value.trim();
          const password = document
            .getElementById("seller-password")
            .value.trim();

          let hasError = false;

          if (!isValidEmail(email) && !isValidPhone(email)) {
            document.getElementById("email-error").textContent =
              "Please enter a valid email or phone number";
            document.getElementById("email-error").classList.add("show");
            hasError = true;
          }

          if (password.length < 6) {
            document.getElementById("password-error").textContent =
              "Password must be at least 6 characters";
            document.getElementById("password-error").classList.add("show");
            hasError = true;
          }

          if (!hasError) {
            localStorage.setItem("user-logged-in", "true");
            localStorage.setItem("user-role", "seller");
            localStorage.setItem("user-email", email);
            const userName = isValidEmail(email)
              ? email.split("@")[0].charAt(0).toUpperCase() +
                email.split("@")[0].slice(1)
              : "Seller";
            localStorage.setItem("user-name", userName);

            window.location.href = "seller-dashboard.html";
          }
        });
    </script>
    <script src="js/base.js"></script>
  </body>
</html>
